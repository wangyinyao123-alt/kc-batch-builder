<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>流程图精灵 · 画布</title>
    <link rel="stylesheet" href="./dist/waui.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <input id="doc-title" class="title-input" type="text" placeholder="未命名图表" aria-label="图表标题" />
      </div>

      <div class="tools">
        <wa-button id="btn-add" size="s" appearance="filled-outlined" title="新建步骤节点 (N)">+ 节点</wa-button>
        <wa-button id="btn-layout" size="s" appearance="filled-outlined" title="自动排版 (L)">自动排版</wa-button>
        <span class="sep"></span>
        <wa-button id="btn-undo" size="s" appearance="plain" title="撤销 (⌘Z)" disabled><span slot="start">↶</span></wa-button>
        <wa-button id="btn-redo" size="s" appearance="plain" title="重做 (⇧⌘Z)" disabled><span slot="start">↷</span></wa-button>
        <span class="sep"></span>
        <wa-button id="btn-zoom-out" size="s" appearance="plain" title="缩小">−</wa-button>
        <wa-button id="btn-zoom-fit" size="s" appearance="filled-outlined" title="适应窗口 (F)"><span id="zoom-label">100%</span></wa-button>
        <wa-button id="btn-zoom-in" size="s" appearance="plain" title="放大">+</wa-button>
      </div>

      <div class="actions">
        <wa-button id="btn-open" size="s" appearance="filled-outlined" title="打开 .json">打开</wa-button>
        <wa-button id="btn-save" size="s" appearance="filled-outlined" title="保存 .json (⌘S)">保存</wa-button>
        <wa-button id="btn-export-svg" class="export" size="s" appearance="plain">SVG</wa-button>
        <wa-button id="btn-export-png" class="export" size="s" appearance="plain">PNG</wa-button>
        <wa-button id="btn-export-vsdx" class="export" size="s" appearance="plain">VSDX</wa-button>
      </div>
    </header>

    <main class="workspace">
      <div id="stage" class="stage" tabindex="0">
        <svg id="canvas" class="canvas" xmlns="http://www.w3.org/2000/svg">
          <defs id="canvas-defs"></defs>
          <rect id="canvas-paper" class="paper" x="0" y="0" width="100%" height="100%" />
          <g id="layer-root">
            <g id="layer-edges"></g>
            <g id="layer-labels"></g>
            <g id="layer-nodes"></g>
            <g id="layer-overlay"></g>
          </g>
        </svg>

        <textarea id="text-editor" class="text-editor" spellcheck="false" hidden></textarea>
        <div id="empty-hint" class="empty-hint">
          <p>画布是空的</p>
          <p class="sub">双击空白处新建节点，或把 Markdown 粘进左边（⌘V）</p>
        </div>
      </div>

      <aside id="inspector" class="inspector">
        <section class="group">
          <h2>模板</h2>
          <div id="template-grid" class="tpl-grid" role="radiogroup" aria-label="模板"></div>
          <div class="row palette-row">
            <span>配色</span>
            <wa-select id="palette" size="s" class="grow" aria-label="配色"></wa-select>
          </div>
        </section>

        <section class="group">
          <h2>选中项</h2>
          <div id="selection-body" class="empty">没有选中任何东西</div>
        </section>

        <section class="group">
          <h2>排版</h2>
          <div class="row">
            <span>方向</span>
            <wa-select id="direction" size="s" class="grow" value="TB">
              <wa-option value="TB">自上而下</wa-option>
              <wa-option value="LR">从左到右</wa-option>
            </wa-select>
          </div>
          <div class="row">
            <span>节点间距</span>
            <wa-number-input id="node-gap" size="s" class="grow" value="40" min="0" max="200" step="4" without-steppers></wa-number-input>
          </div>
          <div class="row">
            <span>层间距</span>
            <wa-number-input id="rank-gap" size="s" class="grow" value="56" min="0" max="300" step="4" without-steppers></wa-number-input>
          </div>
          <p class="note">自动排版会覆盖手动拖过的位置，可以 ⌘Z 撤销。</p>
        </section>

        <section class="group">
          <h2>连线</h2>
          <div class="row">
            <span>箭头</span>
            <wa-select id="edge-arrow-style" size="s" class="grow" aria-label="箭头样式"></wa-select>
          </div>
          <div class="row">
            <span>线型</span>
            <wa-select id="edge-dash" size="s" class="grow" aria-label="线型"></wa-select>
          </div>
          <div class="row">
            <span>颜色</span>
            <div id="edge-color" class="grow color-slot"></div>
          </div>
          <div class="slider-row">
            <span class="slider-label">粗细</span>
            <wa-slider id="edge-width" class="grow" min="0.5" max="4" step="0.5" value="1"></wa-slider>
            <output id="edge-width-out" class="slider-out">1</output>
          </div>
          <div class="slider-row">
            <span class="slider-label">拐角</span>
            <wa-slider id="edge-corner" class="grow" min="0" max="24" step="2" value="0"></wa-slider>
            <output id="edge-corner-out" class="slider-out">0</output>
          </div>
          <div class="slider-row">
            <span class="slider-label">大小</span>
            <wa-slider id="edge-arrow" class="grow" min="6" max="28" step="2" value="12"></wa-slider>
            <output id="edge-arrow-out" class="slider-out">12</output>
          </div>
          <button id="btn-edge-reset" class="link-btn" type="button">恢复模板默认</button>
          <p class="note">拐角调大就会变成圆角，拉到最右接近曲线。</p>
        </section>
      </aside>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="./dist/editor.js"></script>
  </body>
</html>
