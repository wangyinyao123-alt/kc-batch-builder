<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>流程图精灵 · 画布</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <input id="doc-title" class="title-input" type="text" placeholder="未命名图表" aria-label="图表标题" />
      </div>

      <div class="tools">
        <button id="btn-add" class="btn" title="新建步骤节点 (N)">+ 节点</button>
        <button id="btn-layout" class="btn" title="自动排版 (L)">自动排版</button>
        <span class="sep"></span>
        <button id="btn-undo" class="btn icon" title="撤销 (⌘Z)" disabled>↶</button>
        <button id="btn-redo" class="btn icon" title="重做 (⇧⌘Z)" disabled>↷</button>
        <span class="sep"></span>
        <button id="btn-zoom-out" class="btn icon" title="缩小">−</button>
        <button id="btn-zoom-fit" class="btn" title="适应窗口 (F)"><span id="zoom-label">100%</span></button>
        <button id="btn-zoom-in" class="btn icon" title="放大">+</button>
      </div>

      <div class="actions">
        <select id="template" class="select" aria-label="模板"></select>
        <span class="sep"></span>
        <button id="btn-open" class="btn" title="打开 .json">打开</button>
        <button id="btn-save" class="btn" title="保存 .json (⌘S)">保存</button>
        <button id="btn-export-svg" class="btn">SVG</button>
        <button id="btn-export-png" class="btn">PNG</button>
        <button id="btn-export-vsdx" class="btn">VSDX</button>
      </div>
    </header>

    <main class="workspace">
      <div id="stage" class="stage" tabindex="0">
        <svg id="canvas" class="canvas" xmlns="http://www.w3.org/2000/svg">
          <defs id="canvas-defs"></defs>
          <rect id="canvas-paper" class="paper" x="0" y="0" width="100%" height="100%" />
          <g id="layer-root">
            <g id="layer-edges"></g>
            <g id="layer-labels"></g>
            <g id="layer-nodes"></g>
            <g id="layer-overlay"></g>
          </g>
        </svg>

        <textarea id="text-editor" class="text-editor" spellcheck="false" hidden></textarea>
        <div id="empty-hint" class="empty-hint">
          <p>画布是空的</p>
          <p class="sub">双击空白处新建节点，或把 Markdown 粘进左边（⌘V）</p>
        </div>
      </div>

      <aside id="inspector" class="inspector">
        <section class="group">
          <h2>选中项</h2>
          <div id="selection-body" class="empty">没有选中任何东西</div>
        </section>

        <section class="group">
          <h2>排版</h2>
          <label class="row">
            <span>方向</span>
            <select id="direction" class="select small">
              <option value="TB">自上而下</option>
              <option value="LR">从左到右</option>
            </select>
          </label>
          <label class="row">
            <span>节点间距</span>
            <input id="node-gap" class="number" type="number" min="0" max="200" step="4" value="40" />
          </label>
          <label class="row">
            <span>层间距</span>
            <input id="rank-gap" class="number" type="number" min="0" max="300" step="4" value="56" />
          </label>
          <p class="note">自动排版会覆盖手动拖过的位置，可以 ⌘Z 撤销。</p>
        </section>

        <section class="group">
          <h2>快捷键</h2>
          <ul class="keys">
            <li><kbd>双击</kbd> 节点改文字 / 空白新建</li>
            <li><kbd>拖动</kbd> 移动（自动对齐吸附）</li>
            <li><kbd>拖端口</kbd> 拉出连线</li>
            <li><kbd>空格+拖</kbd> 平移画布</li>
            <li><kbd>⌘滚轮</kbd> 缩放</li>
            <li><kbd>⌘Z</kbd> 撤销</li>
            <li><kbd>⌫</kbd> 删除选中</li>
          </ul>
        </section>
      </aside>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="./dist/editor.js"></script>
  </body>
</html>
