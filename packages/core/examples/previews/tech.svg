<rect x="172" y="100" width="136" height="48" rx="6" fill="#393e53" stroke="#949eb2" stroke-width="1"/>
<text x="240" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">用户提交退款申请</text>
