<text x="242" y="244" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">订单是否已发货？</text>
<rect x="20" y="476" width="120" height="48" rx="6" fill="#393e53" stroke="#949eb2" stroke-width="1"/>
<text x="80" y="500" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">直接退款</text>
<polygon points="320,340 448,380 320,420 192,380" fill="#2d3142" stroke="#f08a59" stroke-width="1" stroke-linejoin="round"/>
<text x="320" y="380" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">商品是否影响二次销售？</text>
