<rect x="88" y="324" width="24" height="28" fill="#2d3142"/>
<text x="100" y="338" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#bfc0c0">否</text>
<rect x="316" y="288" width="24" height="28" fill="#2d3142"/>
<text x="328" y="302" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#bfc0c0">是</text>
<rect x="256" y="424" width="24" height="28" fill="#2d3142"/>
<text x="268" y="438" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#bfc0c0">否</text>
<rect x="396" y="424" width="24" height="28" fill="#2d3142"/>
<text x="408" y="438" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#bfc0c0">是</text>
<rect x="92" y="768" width="24" height="28" fill="#2d3142"/>
<text x="104" y="782" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#bfc0c0">是</text>
<rect x="244" y="768" width="24" height="28" fill="#2d3142"/>
<text x="256" y="782" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#bfc0c0">否</text>
<rect x="192" y="0" width="96" height="44" rx="20" ry="20" fill="#f08a59" stroke="#f08a59" stroke-width="1"/>
