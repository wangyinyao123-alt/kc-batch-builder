<svg xmlns="http://www.w3.org/2000/svg" width="524" height="1200" viewBox="0 0 524 1200" role="img" aria-labelledby="dgm-title">
<title id="dgm-title">订单退款流程</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#949eb2"/></marker></defs>
<rect width="524" height="1200" fill="#2d3142"/>
<text x="32" y="60" font-family="'Instrument Serif','Noto Serif TC','Noto Serif SC',serif" font-size="28" font-weight="400" fill="#f5f5f5">订单退款流程</text>
<g transform="translate(32,96)">
<path d="M240,44 L240,72 L240,100" fill="none" stroke="#949eb2" stroke-width="1" marker-end="url(#arrow)" stroke-linejoin="round"/>
