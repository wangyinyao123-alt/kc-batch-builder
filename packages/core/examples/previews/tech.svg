<text x="240" y="500" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">人工审核</text>
<rect x="340" y="476" width="120" height="48" rx="6" fill="#393e53" stroke="#949eb2" stroke-width="1"/>
<text x="400" y="500" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">驳回申请</text>
<rect x="100" y="580" width="120" height="48" rx="6" fill="#393e53" stroke="#949eb2" stroke-width="1"/>
<text x="160" y="604" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">财务打款</text>
<polygon points="160,684 248,724 160,764 72,724" fill="#2d3142" stroke="#f08a59" stroke-width="1" stroke-linejoin="round"/>
<text x="160" y="724" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">打款是否成功？</text>
<rect x="0" y="820" width="148" height="48" rx="6" fill="#393e53" stroke="#949eb2" stroke-width="1"/>
<text x="74" y="844" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">通知用户，流程结束</text>
<rect x="188" y="820" width="120" height="48" rx="6" fill="#393e53" stroke="#949eb2" stroke-width="1"/>
<text x="248" y="844" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">重试三次</text>
<rect x="188" y="924" width="120" height="48" rx="6" fill="#393e53" stroke="#949eb2" stroke-width="1"/>
<text x="248" y="948" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#f5f5f5">人工介入</text>
<rect x="200" y="1028" width="96" height="44" rx="20" ry="20" fill="#bfc0c0" stroke="#bfc0c0" stroke-width="1"/>
<text x="248" y="1050" text-anchor="middle" dominant-baseline="central" font-family="'Geist','Noto Sans TC','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#111111">结束</text>
